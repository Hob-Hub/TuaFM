name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones antiguas del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Solo dependencias de producción: lo que se envía al usuario. Las
      # vulnerabilidades del tooling de build (esbuild vía vite, devDeps) no
      # llegan al artefacto estático desplegado y su único fix es un major con
      # rotura (vite 8), así que no deben tumbar el CI en cada push.
      - name: Audit (vulnerabilidades high/critical en producción)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
